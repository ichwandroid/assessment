            padding: 1rem; border-radius: 16px; font-size: 1rem; }
    a.btn:active { transform: scale(.98); }
    .tips { margin-top: 1.5rem; background: #f8fafc; border-radius: 14px; padding: 1rem;
            font-size: .78rem; color: #475569; text-align: left; line-height: 1.6; }
